<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:276,&quot;height&quot;:820},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inbox&quot;,&quot;today&quot;,&quot;upcoming&quot;,&quot;home&quot;,&quot;graph&quot;,&quot;bio&quot;,&quot;chem&quot;,&quot;math&quot;,&quot;hist&quot;,&quot;econ&quot;,&quot;phil&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">

    const on = id => a === id;
    const items = [

    ];
    const CS = [

      ['math', 'Linear Algebra', 'change_history', '#D6E2FA', '#274FA8', '#6E97EC'], ['hist', 'Modern Europe', 'account_balance', '#FBE8C4', '#8F5D0E', '#E8B85C'],

    const circles = CS.map(([id, name, icon, bg, fg]) => ({ icon, bg, fg, active: a === id, ring: a === id ? '0 0 0 2px #F6F6F8, 0 0 0 4px ' + fg : 'none' }));
    const it = (title, o = {}) => ({ title, count: o.count || '', meta: o.meta || '', hasMeta: !!o.meta, icon: o.icon || '', hasIcon: !!o.icon, dot: o.dot || '', hasDot: !!o.dot, ic: o.on ? '#2F6BEB' : '#686C78', bg: o.on ? '#E6EDFD' : 'transparent', color: o.on ? '#2457D6' : '#1C1E26' });

      ] },
      timetable: { title: 'Timetable', btn: 'Add session', btnIcon: 'add', key: '', sections: [
        { label: 'Weeks', items: [it('Week 4', { meta: '21 – 25 Sep', icon: 'date_range' }), it('Week 5', { meta: '28 Sep – 2 Oct · now', icon: 'date_range', on: true }), it('Week 6', { meta: '5 – 9 Oct', icon: 'date_range' }), it('Week 7', { meta: 'Reading week', icon: 'date_range' })] },

      ] },
      list: { title: 'Fall 2026', btn: 'New course', btnIcon: 'add', key: '', sections: [

        { label: 'Semester', items: [it('Credits', { icon: 'school', count: '18' }), it('GPA', { icon: 'trending_up', count: '3.7' }), it('Tasks done', { icon: 'task_alt', count: '41/58' })] }
      ] },
      project: { title: 'Cell Biology', hasDot: true, dot: '#6FBF7A', btn: 'New to-do', btnIcon: 'add_task', key: '⌘N', sections: [
        { label: 'Headings', items: [it('Assignments', { icon: 'assignment', count: '2' }), it('Exam prep', { icon: 'quiz', count: '3', on: true }), it('Lectures', { icon: 'school', count: '16' }), it('Reference', { icon: 'bookmark', count: '3' })] },
        { label: 'Logbook', items: [it('Flashcards: organelles', { icon: 'task_alt', meta: 'Done Sat' }), it('Problem set 2', { icon: 'task_alt', meta: 'Done 18 Sep' })] }
      ] },
      dash: { title: 'Cell Biology', hasDot: true, dot: '#6FBF7A', btn: 'New note', btnIcon: 'edit_square', key: '⌘N', sections: [
        { label: 'Course info', items: [it('Dr. Okafor', { icon: 'person', meta: 'okafor@uni.edu' }), it('Office hours', { icon: 'schedule', meta: 'Tue 14:00 · Sci 310' }), it('Sci 204', { icon: 'location_on', meta: 'Tue, Thu 10:00' })] },
        { label: 'Files', items: [it('Syllabus.pdf', { icon: 'picture_as_pdf' }), it('Lab manual.pdf', { icon: 'picture_as_pdf' }), it('Past papers', { icon: 'folder', count: '4' })] }

      lectureSeq: { title: 'Cell Biology', hasDot: true, dot: '#6FBF7A', btn: 'New lecture note', btnIcon: 'edit_square', key: '⌘N', sections: [

      ] };
    } else if (a === 'graph') {
      panel = { title: 'Graph map', btn: 'New saved view', btnIcon: 'add', key: '', sections: [

      ] };
    } else {
      const recent = [['Cell membrane', 'Cell Biology · Today', '#6FBF7A'], ['Stereochemistry', 'Organic Chem · Yesterday', '#7FA88A'], ['Determinants', 'Linear Algebra · Sat', '#6E97EC'], ['The 1848 revolutions', 'Modern Europe · Fri', '#E8B85C'], ['IS–LM model', 'Macroeconomics · Thu', '#9A86DE']];
      panel = { title: 'Fall 2026', btn: 'New note', btnIcon: 'edit_square', key: '⌘N', sections: [
        { label: 'Pinned', items: [it('Midterm formula sheet', { icon: 'push_pin' }), it('Semester plan', { icon: 'push_pin' })] },
        { label: 'Recent', items: recent.map(([t, m, d]) => it(t, { dot: d, meta: m })) }
      ] };
    }
    const defTab = { home: 'Courses', bio: 'Cell Biology', graph: 'Graph map', inbox: 'Inbox', today: 'Today', upcoming: 'Upcoming' };
    const dots = { 'Courses': '#9A9DA6', 'Cell Biology': '#6FBF7A', 'Cell membrane': '#6FBF7A', 'Graph map': '#9A9DA6', 'Inbox': '#9A9DA6', 'Problem set 4': '#6E97EC', 'The 1848 revolutions': '#E8B85C' };
    const cur = this.props.tab ?? defTab[a] ?? 'Courses';
    const pool = ['Cell membrane', 'Problem set 4', 'The 1848 revolutions', 'Courses'].filter(t => t !== cur);
    const titles = [pool[0], cur, pool[1], pool[2]];
    const tabs = titles.map((title, i) => {
      const active = title === cur;
      const nextActive = titles[i + 1] === cur;
      return { title, active, dot: dots[title] || '#9A9DA6', sep: !active && !nextActive && i < titles.length - 1, bg: active ? '#fff' : 'transparent', hover: active ? '#fff' : '#EDEEF1', border: active ? '1px solid #E9EAEE' : '1px solid transparent', h: active ? '37px' : '32px', mb: active ? '-1px' : '4px', color: active ? '#1C1E26' : '#686C78' };
    });
    const notesOnly = this.props.mode === 'notes';
    const spaces = !!this.props.spaces || notesOnly;
    const space = notesOnly ? 1 : spaces ? (this.state.space ?? (this.props.space === 'notes' ? 1 : 0)) : 0;
    const setSpace = i => this.setState({ space: Math.max(0, Math.min(1, i)) });
    const onWheel = e => {
      if (!spaces || notesOnly || Math.abs(e.deltaX) < 12 || Math.abs(e.deltaX) < Math.abs(e.deltaY)) return;
      const now = Date.now(); if (now - this.lock < 600) return; this.lock = now;
      setSpace(space + (e.deltaX > 0 ? 1 : -1));
    };
    const cdef = CS.find(x => x[0] === a);
    const spaceDefs = [{ name: panel.title, icon: cdef ? cdef[2] : 'grid_view', abg: cdef ? cdef[3] : '#E9EAEE', afg: cdef ? cdef[4] : '#1C1E26', ring: cdef ? cdef[4] : '#1C1E26' }, { name: 'Notes', icon: 'description', abg: '#E6EDFD', afg: '#2457D6', ring: '#2F6BEB' }];
    const spaceDots = spaceDefs.map((d, i) => { const on = i === space; return { name: d.name, icon: d.icon, bg: on ? d.abg : 'transparent', fg: on ? d.afg : '#9A9DA6', ring: on ? '0 0 0 2px #fff, 0 0 0 3.5px ' + d.ring : 'inset 0 0 0 1px #DFE1E6', hover: on ? d.abg : '#F0F1F4', go: () => setSpace(i) }; });
    const noteList = [
      { group: 'This week', items: [
        { title: 'Lecture 8 — Cell membrane', snip: 'Phospholipid bilayer and the fluid mosaic model.', time: 'Thu', sel: true },
        { title: 'Membrane transport summary', snip: 'Passive vs active transport, with examples.', time: 'Wed' }
      ] },
      { group: 'Last week', items: [
        { title: 'Lecture 7 — Organelles', snip: 'Structure and function of each organelle.', time: 'Tue' },
        { title: 'Lecture 6 — Prokaryotes', snip: 'Key differences from eukaryotic cells.', time: 'Thu' },
        { title: 'Glossary', snip: 'Terms to know for the midterm.', time: 'Mon' }
      ] }
    ].map(g => ({ ...g, items: g.items.map(i => ({ ...i, bg: i.sel ? '#E6EDFD' : 'transparent' })) }));
    return { tabs, rail, circles, panel, open: !collapsed, toggle: () => this.setState({ collapsed: !collapsed }),
      stripGap: this.props.rightPanel ? '290px' : '0px',
      toggleRight: e => e.currentTarget.dispatchEvent(new CustomEvent('margin-toggle-right', { bubbles: true })),
      spaces, showSwitch: spaces && !notesOnly, notesOnly, backHref: this.props.backHref ?? '#', spaceDots, noteList, onWheel, asideW: spaces ? '280px' : '220px', trackW: spaces ? '200%' : '100%', trackX: spaces ? (space * -50) + '%' : '0%' };
  }
}
</script>
</body>
